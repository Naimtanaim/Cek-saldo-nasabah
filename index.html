<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cek Saldo Nasabah - Toko Zizan</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#1e293b;font-family:Arial,sans-serif}
.header{background:#1f4e78;color:white;padding:22px 15px;text-align:center}.header h1{margin:0;font-size:22px}.header p{margin:7px 0 0;font-size:13px}
.container{max-width:520px;margin:25px auto;padding:0 15px}.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 5px 20px #0001;margin-bottom:16px}
h2{font-size:18px;margin:0 0 15px;color:#1f4e78}label{display:block;font-size:13px;font-weight:bold;margin:12px 0 6px}
input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}
button{width:100%;border:0;border-radius:8px;padding:12px;background:#007bff;color:white;font-weight:bold;font-size:15px;margin-top:15px;cursor:pointer}
button.secondary{background:#64748b}.error{display:none;background:#fee2e2;color:#991b1b;padding:11px;border-radius:8px;margin-top:12px;font-size:13px}.loading{display:none;text-align:center;color:#475569;margin-top:12px}
.profile{border-bottom:1px dashed #cbd5e1;padding-bottom:12px;margin-bottom:12px}.profile div{margin:6px 0;font-size:14px}
.balance{background:#eef6ff;border:1px solid #bfdbfe;border-radius:12px;padding:18px;text-align:center;margin:15px 0}.balance small{display:block;color:#475569}.balance strong{display:block;color:#1f4e78;font-size:28px}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #e2e8f0;font-size:13px}.muted{color:#64748b;font-size:12px;line-height:1.5}.badge{padding:4px 8px;border-radius:10px;background:#dcfce7;color:#166534;font-weight:bold}
</style>
</head>
<body>
<div class="header"><h1>SIMPAN PINJAM TOKO ZIZAN</h1><p>Cek Saldo Nasabah</p></div>
<div class="container">
<div class="card">
<h2>🔎 Cari Data Nasabah</h2>
<p class="muted">Masukkan Nama atau NIK/KTP. Untuk keamanan, NIK sebaiknya nomor lengkap.</p>
<label>Nama Lengkap</label><input id="nama" placeholder="Contoh: Budi Santoso">
<label>NIK / KTP</label><input id="nik" inputmode="numeric" placeholder="Contoh: 3171012345670001">
<button onclick="cekSaldo()">🔍 Cek Saldo</button>
<div id="loading" class="loading">Memeriksa database...</div><div id="error" class="error"></div>
</div>
<div id="hasil" class="card" style="display:none">
<h2>📋 Data Nasabah</h2>
<div class="profile">
<div><b>ID Nasabah:</b> <span id="rKode">-</span></div>
<div><b>Nama:</b> <span id="rNama">-</span></div>
<div><b>NIK:</b> <span id="rNik">-</span></div>
<div><b>No. Telepon:</b> <span id="rTlp">-</span></div>
<div><b>Alamat:</b> <span id="rAlamat">-</span></div>
</div>
<div class="balance"><small>SALDO SIMPANAN</small><strong id="rSaldo">Rp 0</strong></div>
<h2>💰 Riwayat Transaksi</h2><div id="riwayat"></div>
<button class="secondary" onclick="resetHasil()">🔄 Cek Nasabah Lain</button>
</div>
</div>
<script>
const SUPABASE_URL="https://txnncavqdlqwbarvpwht.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR4bm5jYXZxZGxxd2JhcnZwd2h0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzODk0MzMsImV4cCI6MjEwMTk2NTQzM30.Vof9Xp5paDfb5nwnmAhwPJpqtOucP8zuoPxcRb1FAMw";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

function rp(v){return "Rp "+Number(v||0).toLocaleString("id-ID")}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function err(m){let e=document.getElementById("error");e.textContent=m;e.style.display="block"}
function clearErr(){document.getElementById("error").style.display="none"}

async function cekSaldo(){
 clearErr();let nama=document.getElementById("nama").value.trim(),nik=document.getElementById("nik").value.trim();
 if(!nama&&!nik)return err("Masukkan Nama atau NIK terlebih dahulu.");
 if(SUPABASE_URL.includes("PASTE_")||SUPABASE_KEY.includes("PASTE_"))return err("Masukkan Project URL dan Publishable/anon key Supabase pada bagian konfigurasi HTML.");
 document.getElementById("loading").style.display="block";document.getElementById("hasil").style.display="none";
 try{
  let q=db.from("nasabah").select("id,kode,nama,nik,tlp,alamat,tgl");
  q=nik?q.eq("nik",nik):q.ilike("nama","%"+nama+"%");
  const {data,error}=await q.limit(10);if(error)throw error;
  if(!data?.length)return err("Data nasabah tidak ditemukan.");
  if(data.length>1&&!nik)return err("Ditemukan lebih dari satu nama. Masukkan NIK agar hasil tepat.");
  const n=data[0];
  rKode.textContent=n.kode||"-";rNama.textContent=n.nama||"-";rNik.textContent=n.nik||"-";rTlp.textContent=n.tlp||"-";rAlamat.textContent=n.alamat||"-";
  const {data:t,error:te}=await db.from("transaksi").select("kode,tgl,jenis,nominal,ket").eq("nasabah_id",n.id).order("tgl",{ascending:false});
  if(te)throw te;
  let saldo=0;(t||[]).forEach(x=>saldo+=x.jenis==="Setor Tunai"?Number(x.nominal):x.jenis==="Tarik Tunai"?-Number(x.nominal):0);
  rSaldo.textContent=rp(saldo);
  riwayat.innerHTML=t?.length?t.slice(0,20).map(x=>`<div class="row"><div><b>${esc(x.jenis)}</b><br><span class="muted">${esc(x.tgl||"")}</span>${x.ket?`<br><span class="muted">${esc(x.ket)}</span>`:""}</div><div style="text-align:right"><b>${x.jenis==="Setor Tunai"?"+":"-"} ${rp(x.nominal)}</b><br><span class="badge">${esc(x.kode)}</span></div></div>`).join(""):"<p class='muted'>Belum ada transaksi.</p>";
  hasil.style.display="block";
 }catch(e){console.error(e);err("Gagal mengambil data: "+(e.message||e))}
 finally{loading.style.display="none"}
}
function resetHasil(){hasil.style.display="none";nama.value="";nik.value="";clearErr();nama.focus()}
nama.addEventListener("keydown",e=>{if(e.key==="Enter")cekSaldo()});nik.addEventListener("keydown",e=>{if(e.key==="Enter")cekSaldo()});
</script>
</body></html>
